name: Build LaTeX kit

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-kit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Build KIT
        env:
          TEXINPUTS: .:library/tex:
          max_print_line: 1048576
        run: |
          make kit
          ls build/*.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: mvb-kit
          path: build/**/*.pdf
