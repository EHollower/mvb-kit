name: Build LaTeX kit

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  build-kit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build KIT
        env:
          TEXINPUTS: .:library/tex:
          max_print_line: 1048576
        run: |
          set -euo pipefail
          make kit || { echo "build failed"; exit 1; }

      - name: Show output files
        run: ls -l build || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvb-kit
          path: build/**/*.pdf

