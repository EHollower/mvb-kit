name: Build LaTeX kit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-kit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live and fonts (enable universe)
        run: |
          set -euo pipefail
          sudo apt-get update
          # ensure add-apt-repository is available and enable 'universe'
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes universe
          sudo apt-get update
          # install TeX + a commonly-available Fira-family programming font (Fira Code)
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-recommended latexmk fonts-firacode
          # rebuild font caches so fontspec/luaotfload can find them
          sudo fc-cache -fv
          # update luaotfload font database (may fail harmlessly if not present)
          luaotfload-tool --update || true

      - name: Build KIT
        env:
          TEXINPUTS: .:library/tex
          max_print_line: 1048576
        run: |
          set -euo pipefail
          make kit || { echo "build failed"; exit 1; }

      - name: Show output files
        run: ls -l build || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvb-kit
          path: build/**/*.pdf
